<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #2c2c2a; background: #faf8f3; }
  .container { max-width: 100%; padding: 16px; }
  .header { margin-bottom: 20px; text-align: center; }
  .title { font-size: 20px; font-weight: 600; color: #2c2c2a; margin: 0; letter-spacing: -0.3px; }
  .subtitle { font-size: 13px; color: #888780; margin: 4px 0 0 0; }
  
  .card { background: white; border: 0.5px solid #e0ddd4; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 14px; font-weight: 600; color: #2c2c2a; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 0.5px; }
  
  .form-row { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #5f5e5a; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
  input[type="date"], select, input[type="text"], input[type="time"] { width: 100%; padding: 10px 12px; border: 0.5px solid #d3d1c7; border-radius: 4px; font-size: 15px; background: white; color: #2c2c2a; }
  input[type="date"]:focus, select:focus, input[type="text"]:focus, input[type="time"]:focus { outline: none; border-color: #888780; background: white; }
  
  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .checkbox-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 0.5px solid #d3d1c7; border-radius: 4px; background: white; cursor: pointer; transition: all 0.2s; }
  .checkbox-item:hover { background: #f1efe8; border-color: #888780; }
  .checkbox-item.selected { background: #0F6E56; border-color: #0F6E56; }
  .checkbox-item.selected .checkbox-label { color: white; }
  .checkbox-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #0F6E56; }
  .checkbox-item.selected input[type="checkbox"] { accent-color: white; }
  .checkbox-label { font-size: 14px; color: #2c2c2a; font-weight: 500; cursor: pointer; }
  
  button { padding: 10px 12px; border: 0.5px solid #d3d1c7; border-radius: 4px; background: white; color: #2c2c2a; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  button:hover { background: #f1efe8; border-color: #888780; }
  button.primary { background: #2c2c2a; color: white; border-color: #2c2c2a; }
  button.primary:hover { background: #444441; }
  button.success { background: #0F6E56; color: white; border-color: #0F6E56; font-weight: 600; }
  button.success:hover { background: #085041; }
  button.danger-filled { background: #A32D2D; color: white; border-color: #A32D2D; font-weight: 600; }
  button.danger-filled:hover { background: #791F1F; }
  button.small { padding: 6px 10px; font-size: 11px; }
  
  .running-task { background: #E1F5EE; border: 0.5px solid #0F6E56; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .running-task-info { flex: 1; }
  .running-task-name { font-size: 14px; font-weight: 600; color: #2c2c2a; margin: 0; }
  .running-task-details { font-size: 12px; color: #5f5e5a; margin: 4px 0 0 0; }
  .running-task button { background: #A32D2D; color: white; border-color: #A32D2D; font-weight: 600; padding: 8px 12px; font-size: 12px; }
  
  .time-display { font-size: 14px; font-weight: 600; color: #2c2c2a; background: #f1efe8; padding: 8px 12px; border-radius: 4px; margin-top: 6px; }
  .time-label { font-size: 11px; color: #888780; text-transform: uppercase; letter-spacing: 0.3px; }
  
  .associate-section { background: #f1efe8; border: 0.5px solid #d3d1c7; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .associate-header { font-size: 14px; font-weight: 600; color: #2c2c2a; margin: 0 0 12px 0; }
  
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat { background: #f1efe8; padding: 12px; border-radius: 4px; text-align: center; }
  .stat-label { font-size: 11px; color: #888780; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 600; color: #2c2c2a; }
  .stat-sub { font-size: 12px; color: #5f5e5a; margin-top: 4px; }
  
  .task-item { background: white; padding: 12px; border-radius: 4px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 0.5px solid #d3d1c7; }
  .task-info { flex: 1; }
  .task-name { font-size: 14px; font-weight: 500; color: #2c2c2a; margin: 0; }
  .task-time { font-size: 12px; color: #5f5e5a; margin: 4px 0 0 0; }
  .task-actions { display: flex; gap: 6px; }
  
  .empty-state { text-align: center; padding: 24px; color: #888780; }
  .empty-state-icon { font-size: 32px; margin-bottom: 8px; }
  .error { color: #d85a30; font-size: 12px; margin-top: 4px; }
  .hidden { display: none; }
  
  .button-group-col { display: flex; flex-direction: column; gap: 8px; }
  
  .template-btn { padding: 8px 12px; font-size: 12px; background: #f1efe8; border: 0.5px solid #d3d1c7; cursor: pointer; margin: 4px 4px 4px 0; border-radius: 4px; }
  .template-btn:hover { background: #e0ddd4; }
  
  .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 0.5px solid #d3d1c7; }
  .leaderboard-name { font-weight: 500; }
  .leaderboard-util { font-size: 18px; font-weight: 600; color: #0F6E56; }
  
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
  .modal.active { display: flex; align-items: center; justify-content: center; }
  .modal-content { background: white; padding: 24px; border-radius: 8px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-close { float: right; font-size: 24px; cursor: pointer; color: #888780; }
  .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
  
  .break-badge { background: #FFA500; color: white; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
</style>

<div class="container">
  <div class="header">
    <h1 class="title">Utilization tracker</h1>
    <p class="subtitle">Track multiple associates with parallel tasks</p>
  </div>

  <!-- QUICK STATS DASHBOARD -->
  <div class="card">
    <div class="card-title">Today's Overview</div>
    <div id="dashboardContainer"></div>
  </div>

  <!-- SELECT DATE & ASSOCIATES -->
  <div class="card">
    <div class="card-title">Select date & associates</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div>
        <label>Date</label>
        <input type="date" id="trackDate" />
      </div>
      <div>
        <label>Select Associate</label>
        <select id="associateSelect" style="width: 100%;" onchange="selectAssociateFromDropdown()">
          <option value="">-- Choose Associate --</option>
          <option value="Fabricio Justiniano">Fabricio Justiniano</option>
          <option value="Marizabeth Marquez">Marizabeth Marquez</option>
          <option value="Ivey Carthorn">Ivey Carthorn</option>
          <option value="Lezlieth Gil">Lezlieth Gil</option>
          <option value="Odalys Aponte">Odalys Aponte</option>
          <option value="Maurice Kicklighter">Maurice Kicklighter</option>
          <option value="Nathaniel Brown">Nathaniel Brown</option>
          <option value="Steven Cox">Steven Cox</option>
        </select>
      </div>
    </div>
  </div>

  <!-- RUNNING TASKS -->
  <div class="card" id="runningTasksCard" style="display: none;">
    <div class="card-title">Currently running tasks</div>
    <div id="runningTasksList"></div>
  </div>

  <!-- ASSOCIATE SECTIONS -->
  <div id="associateSections"></div>

  <!-- DAILY SUMMARY -->
  <div class="card">
    <div class="card-title">Daily summary</div>
    <div id="summaryContainer"></div>
  </div>

  <!-- BREAK TRACKING -->
  <div class="card">
    <div class="card-title">Break Management</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div>
        <label>Associate</label>
        <select id="breakAssociate">
          <option value="">Select associate</option>
          <option value="Fabricio Justiniano">Fabricio Justiniano</option>
          <option value="Marizabeth Marquez">Marizabeth Marquez</option>
          <option value="Ivey Carthorn">Ivey Carthorn</option>
          <option value="Lezlieth Gil">Lezlieth Gil</option>
          <option value="Odalys Aponte">Odalys Aponte</option>
          <option value="Maurice Kicklighter">Maurice Kicklighter</option>
          <option value="Nathaniel Brown">Nathaniel Brown</option>
          <option value="Steven Cox">Steven Cox</option>
        </select>
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button class="success" onclick="startBreakForm()" style="width: 100%; background: #FFA500; border-color: #FFA500;">Start Break</button>
      </div>
    </div>
    <div id="breakStatusContainer" style="margin-top: 12px;"></div>
  </div>

  <!-- LEADERBOARD -->
  <div class="card">
    <div class="card-title">Associate Leaderboard</div>
    <div id="leaderboardContainer"></div>
  </div>

  <!-- ALL TASKS -->
  <div class="card">
    <div class="card-title">All tasks</div>
    <div class="form-row">
      <div><label>Filter by date</label><input type="date" id="filterDate" /></div>
    </div>
    <div id="allTasksList"></div>
  </div>

  <!-- EXPORT -->
  <div class="card">
    <div class="card-title">Data export</div>
    <div class="form-row">
      <div><label>Export Date Range</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <input type="date" id="exportFromDate" placeholder="From">
          <input type="date" id="exportToDate" placeholder="To">
        </div>
      </div>
    </div>
    <div class="button-group-col">
      <button onclick="exportCSVRange()">Export CSV (Date Range)</button>
      <button onclick="exportCSV()">Export CSV (All)</button>
      <button onclick="exportJSON()">Export JSON</button>
      <button onclick="document.getElementById('fileInput').click();">Restore backup</button>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="importJSON(event)" />
    <div style="font-size: 12px; color: #5f5e5a; margin-top: 8px; padding: 8px; background: #f1efe8; border-radius: 4px;">
      <strong>Total records:</strong> <span id="totalRecords">0</span> days tracked
    </div>
  </div>
</div>

<!-- EDIT TASK MODAL -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeEditModal()">&times;</span>
    <div class="modal-title">Edit Task</div>
    <div class="form-row">
      <div><label>Task description</label><input type="text" id="editDesc" /></div>
    </div>
    <div class="form-row">
      <div><label>Start time</label><input type="time" id="editStart" /></div>
    </div>
    <div class="form-row">
      <div><label>End time</label><input type="time" id="editEnd" /></div>
    </div>
    <div class="form-row">
      <div><label>Type</label>
        <select id="editType">
          <option value="task">Task</option>
          <option value="break">Break</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div><label>Blocker</label>
        <select id="editBlocker" onchange="toggleEditBlockerInput()">
          <option value="">None</option>
          <option value="waiting">Waiting on stage</option>
          <option value="equipment">Equipment issue</option>
          <option value="customer">Waiting on customer</option>
          <option value="materials">Missing materials</option>
          <option value="quality">Quality check</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>
    <div class="form-row hidden" id="editBlockerInputRow">
      <div><label>Describe the blocker</label><input type="text" id="editBlockerText" placeholder="Enter reason..." /></div>
    </div>
    <div class="modal-buttons">
      <button class="success" style="flex: 1;" onclick="saveEditTask()">Save</button>
      <button class="danger-filled" style="flex: 1;" onclick="deleteTask()">Delete</button>
      <button style="flex: 1;" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'utilization_tracker_data';
  const TEMPLATES_KEY = 'task_templates';
  const RUNNING_TASKS_KEY = 'running_tasks';
  const ASSOCIATES = ['Fabricio Justiniano', 'Marizabeth Marquez', 'Ivey Carthorn', 'Lezlieth Gil', 'Odalys Aponte', 'Maurice Kicklighter', 'Nathaniel Brown', 'Steven Cox'];
  let allData = {};
  let selectedAssociates = [];
  let runningTasks = {};
  let templates = {};
  let editingTask = null;

  function init() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('trackDate').value = today;
    document.getElementById('filterDate').value = today;
    document.getElementById('exportFromDate').value = today;
    document.getElementById('exportToDate').value = today;
    document.getElementById('filterDate').addEventListener('change', updateDisplay);
    loadData();
    loadTemplates();
    loadRunningTasks();
    updateDisplay();
  }

  function selectAssociateFromDropdown() {
    const assoc = document.getElementById('associateSelect').value;
    if (assoc === '') {
      selectedAssociates = [];
    } else {
      selectedAssociates = [assoc];
    }
    updateDisplay();
  }

  function loadData() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      allData = saved ? JSON.parse(saved) : {};
    } catch (e) {
      allData = {};
    }
  }

  function loadTemplates() {
    try {
      const saved = localStorage.getItem(TEMPLATES_KEY);
      templates = saved ? JSON.parse(saved) : {};
    } catch (e) {
      templates = {};
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    } catch (e) {
      console.error('Save failed', e);
    }
  }

  function saveTemplates() {
    try {
      localStorage.setItem(TEMPLATES_KEY, JSON.stringify(templates));
    } catch (e) {
      console.error('Template save failed', e);
    }
  }

  function saveRunningTasks() {
    try {
      localStorage.setItem(RUNNING_TASKS_KEY, JSON.stringify(runningTasks));
    } catch (e) {
      console.error('Running tasks save failed', e);
    }
  }

  function loadRunningTasks() {
    try {
      const saved = localStorage.getItem(RUNNING_TASKS_KEY);
      runningTasks = saved ? JSON.parse(saved) : {};
    } catch (e) {
      runningTasks = {};
    }
  }

  function getDateKey(associate) {
    const date = document.getElementById('trackDate').value;
    return `${date}|${associate}`;
  }

  function getCurrentTime() {
    const now = new Date();
    return { hours: String(now.getHours()).padStart(2, '0'), minutes: String(now.getMinutes()).padStart(2, '0'), seconds: String(now.getSeconds()).padStart(2, '0') };
  }

  function addTemplate(assoc) {
    const taskDesc = document.getElementById(`taskDesc_${assoc}`).value.trim();
    if (!taskDesc) { alert('Enter task description'); return; }
    templates[taskDesc] = true;
    saveTemplates();
    alert('Template saved: ' + taskDesc);
  }

  function loadTemplate(assoc, template) {
    document.getElementById(`taskDesc_${assoc}`).value = template;
  }

  function toggleBlockerInput(assoc) {
    const blocker = document.getElementById(`blockerType_${assoc}`).value;
    const inputRow = document.getElementById(`blockerInputRow_${assoc}`);
    if (blocker === 'other') {
      inputRow.classList.remove('hidden');
    } else {
      inputRow.classList.add('hidden');
      document.getElementById(`blockerText_${assoc}`).value = '';
    }
  }

  function startTask(assoc, isBreak = false) {
    const taskDescEl = document.getElementById(`taskDesc_${assoc}`);
    if (!taskDescEl) return;
    
    const taskDesc = taskDescEl.value.trim();
    const errorEl = document.getElementById(`error_${assoc}`);
    if (!errorEl) return;
    errorEl.textContent = '';

    if (!taskDesc) { errorEl.textContent = 'Enter task description'; return; }

    const time = getCurrentTime();
    const blockerEl = document.getElementById(`blockerType_${assoc}`);
    const blockerTextEl = document.getElementById(`blockerText_${assoc}`);
    
    runningTasks[assoc] = { 
      desc: taskDesc, 
      startTime: `${time.hours}:${time.minutes}:${time.seconds}`, 
      startHour: time.hours, 
      startMin: time.minutes, 
      startSec: time.seconds, 
      blocker: blockerEl ? blockerEl.value : '', 
      blockerText: blockerTextEl ? blockerTextEl.value : '', 
      isBreak: isBreak 
    };
    
    const startDisplay = document.getElementById(`startDisplay_${assoc}`);
    if (startDisplay) {
      startDisplay.classList.remove('hidden');
      const timeShow = document.getElementById(`startTimeShow_${assoc}`);
      if (timeShow) timeShow.textContent = runningTasks[assoc].startTime;
    }
    saveRunningTasks();
    updateDisplay();
  }

  function endTask(assoc) {
    const errorEl = document.getElementById(`error_${assoc}`);
    if (errorEl) errorEl.textContent = '';
    if (!runningTasks[assoc]) { if (errorEl) errorEl.textContent = 'Task not started'; return; }

    const time = getCurrentTime();
    const endTime = `${time.hours}:${time.minutes}:${time.seconds}`;
    const startSec = parseInt(runningTasks[assoc].startHour) * 3600 + parseInt(runningTasks[assoc].startMin) * 60 + parseInt(runningTasks[assoc].startSec);
    const endSec = parseInt(time.hours) * 3600 + parseInt(time.minutes) * 60 + parseInt(time.seconds);
    
    if (endSec <= startSec) { if (errorEl) errorEl.textContent = 'End time must be after start'; return; }

    const minutes = Math.round((endSec - startSec) / 60);
    let blocker = runningTasks[assoc].blocker;
    if (blocker === 'other') blocker = `other: ${runningTasks[assoc].blockerText}`;

    const dateKey = getDateKey(assoc);
    if (!allData[dateKey]) allData[dateKey] = { associate: assoc, date: document.getElementById('trackDate').value, tasks: [] };
    
    allData[dateKey].tasks.push({ desc: runningTasks[assoc].desc, start: runningTasks[assoc].startTime, end: endTime, minutes, blocker, isBreak: runningTasks[assoc].isBreak || false, id: Date.now() });

    const taskDescEl = document.getElementById(`taskDesc_${assoc}`);
    if (taskDescEl) taskDescEl.value = '';
    const blockerEl = document.getElementById(`blockerType_${assoc}`);
    if (blockerEl) blockerEl.value = '';
    const blockerTextEl = document.getElementById(`blockerText_${assoc}`);
    if (blockerTextEl) blockerTextEl.value = '';
    const startDisplayEl = document.getElementById(`startDisplay_${assoc}`);
    if (startDisplayEl) startDisplayEl.classList.add('hidden');
    
    delete runningTasks[assoc];
    saveData();
    saveRunningTasks();
    updateDisplay();
  }

  function openEditModal(assoc, taskId) {
    const dateKey = `${document.getElementById('trackDate').value}|${assoc}`;
    const data = allData[dateKey];
    if (!data || !data.tasks) return;
    
    const task = data.tasks.find(t => t.id === taskId);
    if (!task) return;
    
    editingTask = { assoc, taskId, dateKey };
    const editDesc = document.getElementById('editDesc');
    const editStart = document.getElementById('editStart');
    const editEnd = document.getElementById('editEnd');
    const editType = document.getElementById('editType');
    const editBlocker = document.getElementById('editBlocker');
    const editBlockerText = document.getElementById('editBlockerText');
    
    if (editDesc) editDesc.value = task.desc;
    if (editStart) editStart.value = task.start;
    if (editEnd) editEnd.value = task.end;
    if (editType) editType.value = task.isBreak ? 'break' : 'task';
    
    if (editBlocker) {
      if (task.blocker && task.blocker.startsWith('other:')) {
        editBlocker.value = 'other';
        const customText = task.blocker.replace('other: ', '');
        if (editBlockerText) editBlockerText.value = customText;
        const inputRow = document.getElementById('editBlockerInputRow');
        if (inputRow) inputRow.classList.remove('hidden');
      } else {
        editBlocker.value = task.blocker || '';
        const inputRow = document.getElementById('editBlockerInputRow');
        if (inputRow) inputRow.classList.add('hidden');
      }
    }
    
    const modal = document.getElementById('editModal');
    if (modal) modal.classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
    editingTask = null;
  }

  function toggleEditBlockerInput() {
    const blocker = document.getElementById('editBlocker').value;
    const inputRow = document.getElementById('editBlockerInputRow');
    if (blocker === 'other') {
      inputRow.classList.remove('hidden');
    } else {
      inputRow.classList.add('hidden');
      document.getElementById('editBlockerText').value = '';
    }
  }

  function saveEditTask() {
    if (!editingTask) return;
    const data = allData[editingTask.dateKey];
    if (!data || !data.tasks) return;
    
    const task = data.tasks.find(t => t.id === editingTask.taskId);
    if (!task) return;
    
    task.desc = document.getElementById('editDesc').value;
    task.start = document.getElementById('editStart').value;
    task.end = document.getElementById('editEnd').value;
    task.isBreak = document.getElementById('editType').value === 'break';
    
    const editBlocker = document.getElementById('editBlocker').value;
    const editBlockerText = document.getElementById('editBlockerText');
    
    if (editBlocker === 'other' && editBlockerText) {
      task.blocker = `other: ${editBlockerText.value}`;
    } else {
      task.blocker = editBlocker;
    }
    
    saveData();
    closeEditModal();
    updateDisplay();
  }

  function startBreakForm() {
    const assoc = document.getElementById('breakAssociate').value;
    if (!assoc) { alert('Select an associate'); return; }
    
    const dateKey = `${document.getElementById('trackDate').value}|${assoc}`;
    const time = getCurrentTime();
    
    runningTasks[assoc] = { desc: 'Break', startTime: `${time.hours}:${time.minutes}:${time.seconds}`, startHour: time.hours, startMin: time.minutes, startSec: time.seconds, blocker: '', blockerText: '', isBreak: true };
    
    document.getElementById('breakAssociate').value = '';
    saveRunningTasks();
    updateBreakStatus();
  }

  function updateBreakStatus() {
    const breakAssocs = Object.keys(runningTasks).filter(assoc => runningTasks[assoc].isBreak);
    
    if (breakAssocs.length === 0) {
      document.getElementById('breakStatusContainer').innerHTML = '';
      return;
    }
    
    const html = breakAssocs.map(assoc => `
      <div class="running-task">
        <div class="running-task-info">
          <p class="running-task-name">${assoc} - Break</p>
          <p class="running-task-details">Started: ${runningTasks[assoc].startTime}</p>
        </div>
        <button onclick="endBreak('${assoc}')">End Break</button>
      </div>
    `).join('');
    
    document.getElementById('breakStatusContainer').innerHTML = html;
  }

  function endBreak(assoc) {
    if (!runningTasks[assoc]) { alert('Break not started'); return; }

    const time = getCurrentTime();
    const endTime = `${time.hours}:${time.minutes}:${time.seconds}`;
    const startSec = parseInt(runningTasks[assoc].startHour) * 3600 + parseInt(runningTasks[assoc].startMin) * 60 + parseInt(runningTasks[assoc].startSec);
    const endSec = parseInt(time.hours) * 3600 + parseInt(time.minutes) * 60 + parseInt(time.seconds);
    
    if (endSec <= startSec) { alert('End time must be after start'); return; }

    const minutes = Math.round((endSec - startSec) / 60);
    const dateKey = `${document.getElementById('trackDate').value}|${assoc}`;
    if (!allData[dateKey]) allData[dateKey] = { associate: assoc, date: document.getElementById('trackDate').value, tasks: [] };
    
    allData[dateKey].tasks.push({ desc: 'Break', start: runningTasks[assoc].startTime, end: endTime, minutes, blocker: '', isBreak: true, id: Date.now() });
    
    delete runningTasks[assoc];
    saveData();
    saveRunningTasks();
    updateBreakStatus();
    updateDisplay();
  }

  function updateDisplay() {
    updateDashboard();
    updateAssociateSections();
    updateRunningTasks();
    updateBreakStatus();
    setTimeout(function() { updateSummary(); }, 50);
  }

  function updateDashboard() {
    const today = document.getElementById('trackDate').value;
    let totalMin = 0, totalBreakMin = 0, totalTasks = 0;
    
    for (const key in allData) {
      const [date, assoc] = key.split('|');
      if (date === today) {
        allData[key].tasks.forEach(t => {
          if (t.isBreak) {
            totalBreakMin += t.minutes;
          } else {
            totalMin += t.minutes;
            totalTasks++;
          }
        });
      }
    }
    
    const totalHours = Math.round(totalMin / 60 * 10) / 10;
    const breakHours = Math.round(totalBreakMin / 60 * 10) / 10;
    const utilPercent = Math.round(totalMin / (480 * ASSOCIATES.length) * 100);
    
    const html = `
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
        <div class="stat">
          <div class="stat-label">Total Tasks</div>
          <div class="stat-value">${totalTasks}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Active Time</div>
          <div class="stat-value">${totalHours}h</div>
          <div class="stat-sub">+ ${breakHours}h breaks</div>
        </div>
        <div class="stat">
          <div class="stat-label">Team Util %</div>
          <div class="stat-value">${utilPercent}%</div>
        </div>
      </div>
    `;
    
    document.getElementById('dashboardContainer').innerHTML = html;
  }

  function updateRunningTasks() {
    const runningCard = document.getElementById('runningTasksCard');
    const runningList = document.getElementById('runningTasksList');
    const runningAssocs = Object.keys(runningTasks);

    if (runningAssocs.length === 0) {
      runningCard.style.display = 'none';
      return;
    }

    runningCard.style.display = 'block';
    runningList.innerHTML = runningAssocs.map(assoc => {
      const task = runningTasks[assoc];
      return `
        <div class="running-task">
          <div class="running-task-info">
            <p class="running-task-name">${assoc}</p>
            <p class="running-task-details">${task.desc} | Started: ${task.startTime}</p>
          </div>
          <button onclick="endTask('${assoc}')">End</button>
        </div>
      `;
    }).join('');
  }

  function updateAssociateSections() {
    const container = document.getElementById('associateSections');
    
    if (selectedAssociates.length === 0) {
      container.innerHTML = '';
      return;
    }

    container.innerHTML = selectedAssociates.map(assoc => {
      const dateKey = getDateKey(assoc);
      const data = allData[dateKey] || { associate: assoc, tasks: [] };
      const tasks = data.tasks || [];
      const workTasks = tasks.filter(t => !t.isBreak);
      const totalMin = workTasks.reduce((s, t) => s + t.minutes, 0);
      const util = Math.round(totalMin / 480 * 100);
      const isRunning = !!runningTasks[assoc];

      return `
        <div class="associate-section">
          <div class="associate-header">${assoc}</div>
          <div class="card-title" style="margin-top: 0; font-size: 12px;">Task Log</div>
          
          <div class="form-row"><div><label>Task description</label><input type="text" id="taskDesc_${assoc}" placeholder="e.g., Pick orders" /></div></div>
          
          <div style="margin-bottom: 12px;">
            <label>Task Templates:</label>
            <div style="display: flex; flex-wrap: wrap;">
              ${Object.keys(templates).map(t => `<button class="template-btn" onclick="loadTemplate('${assoc}', '${t}')">${t}</button>`).join('')}
              <button class="template-btn" onclick="addTemplate('${assoc}')">+ Save Template</button>
            </div>
          </div>
          
          <div class="form-row">
            <div><label>Blocker</label>
              <select id="blockerType_${assoc}" onchange="toggleBlockerInput('${assoc}')">
                <option value="">None</option>
                <option value="waiting">Waiting on stage</option>
                <option value="equipment">Equipment issue</option>
                <option value="customer">Waiting on customer</option>
                <option value="materials">Missing materials</option>
                <option value="quality">Quality check</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row hidden" id="blockerInputRow_${assoc}">
            <div><label>Describe the blocker</label><input type="text" id="blockerText_${assoc}" placeholder="Enter reason..." /></div>
          </div>

          <div class="time-display hidden" id="startDisplay_${assoc}"><span class="time-label">Started:</span> <span id="startTimeShow_${assoc}">--:--:--</span></div>

          <div id="error_${assoc}" class="error"></div>
          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button class="success" onclick="startTask('${assoc}')" style="flex: 1;" ${isRunning ? 'disabled' : ''}>Start task</button>
            <button class="danger-filled" onclick="endTask('${assoc}')" style="flex: 1;" ${!isRunning ? 'disabled' : ''}>End</button>
          </div>

          <div style="margin-top: 16px; padding-top: 12px; border-top: 0.5px solid #d3d1c7;">
            <div style="font-size: 13px; font-weight: 600; color: #2c2c2a; margin-bottom: 8px;">Completed: ${workTasks.length} | Active: ${Math.round(totalMin / 60 * 10) / 10}h | Util: ${util}%</div>
            <div id="tasks_${assoc}">${tasks.length === 0 ? '<div class="empty-state" style="padding: 12px;">No tasks yet</div>' : tasks.map(t => `
              <div class="task-item">
                <div class="task-info">
                  <p class="task-name">${t.isBreak ? '<span class="break-badge">BREAK</span> ' : ''}${t.desc}</p>
                  <p class="task-time">${t.start} – ${t.end} (${t.minutes} min)${t.blocker ? ' 🚨 ' + t.blocker : ''}</p>
                </div>
                <div class="task-actions">
                  <button class="small" onclick="openEditModal('${assoc}', ${t.id})">Edit</button>
                </div>
              </div>
            `).join('')}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function updateSummary() {
    const summaryContainer = document.getElementById('summaryContainer');
    if (!summaryContainer) return;
    
    if (selectedAssociates.length === 0) {
      summaryContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">↳</div>Select associates to begin tracking</div>';
      updateLeaderboard();
      updateAllTasksList();
      return;
    }

    let totalTasksAll = 0, totalMinAll = 0;
    
    selectedAssociates.forEach(assoc => {
      const dateKey = getDateKey(assoc);
      const data = allData[dateKey];
      
      if (data && data.tasks && Array.isArray(data.tasks)) {
        const workTasks = data.tasks.filter(t => !t.isBreak);
        totalTasksAll += workTasks.length;
        totalMinAll += workTasks.reduce((s, t) => s + (t.minutes || 0), 0);
      }
    });

    const hoursAll = Math.round(totalMinAll / 60 * 10) / 10;
    const utilAll = Math.round(totalMinAll / (480 * selectedAssociates.length) * 100);

    summaryContainer.innerHTML = `
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">Total tasks</div>
          <div class="stat-value">${totalTasksAll}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Combined time</div>
          <div class="stat-value">${hoursAll}h</div>
          <div class="stat-sub">across ${selectedAssociates.length} associate(s)</div>
        </div>
      </div>
    `;
    updateLeaderboard();
    updateAllTasksList();
  }

  function updateLeaderboard() {
    const leaderboardContainer = document.getElementById('leaderboardContainer');
    const filterDate = document.getElementById('filterDate').value;
    
    let leaderboardData = [];
    
    ASSOCIATES.forEach(assoc => {
      const dateKey = `${filterDate}|${assoc}`;
      const data = allData[dateKey];
      const workTasks = data && data.tasks ? data.tasks.filter(t => !t.isBreak) : [];
      const totalMin = workTasks.reduce((s, t) => s + (t.minutes || 0), 0);
      const util = Math.round(totalMin / 480 * 100);
      leaderboardData.push({ assoc, util, tasks: workTasks.length });
    });
    
    leaderboardData.sort((a, b) => b.util - a.util);
    
    leaderboardContainer.innerHTML = leaderboardData.map((item, idx) => `
      <div class="leaderboard-item">
        <div>
          <div style="font-weight: 600;">${idx + 1}. ${item.assoc}</div>
          <div style="font-size: 12px; color: #888780;">${item.tasks} tasks</div>
        </div>
        <div class="leaderboard-util">${item.util}%</div>
      </div>
    `).join('');
  }

  function updateAllTasksList() {
    const allTasksList = document.getElementById('allTasksList');
    const filterDate = document.getElementById('filterDate').value;
    
    if (!allTasksList) return;

    let allTasks = [];
    
    if (selectedAssociates.length === 0) {
      for (const key in allData) {
        const [date, assoc] = key.split('|');
        if (date === filterDate && allData[key].tasks && Array.isArray(allData[key].tasks)) {
          allData[key].tasks.forEach(t => {
            allTasks.push({ ...t, associate: assoc });
          });
        }
      }
    } else {
      selectedAssociates.forEach(assoc => {
        const dateKey = `${filterDate}|${assoc}`;
        const data = allData[dateKey];
        
        if (data && data.tasks && Array.isArray(data.tasks)) {
          data.tasks.forEach(t => {
            allTasks.push({ ...t, associate: assoc });
          });
        }
      });
    }

    let allTasksHTML = '';
    if (allTasks.length === 0) {
      allTasksHTML = '<div class="empty-state"><div class="empty-state-icon">↳</div>No tasks logged yet</div>';
    } else {
      allTasksHTML = allTasks.map(t => `
        <div class="task-item">
          <div class="task-info">
            <p class="task-name">${t.isBreak ? '<span class="break-badge">BREAK</span> ' : ''}${t.desc}</p>
            <p class="task-time"><strong>${t.associate.split(' ')[0]}</strong> | ${t.start} – ${t.end} (${t.minutes} min)${t.blocker ? ' 🚨 ' + t.blocker : ''}</p>
          </div>
        </div>
      `).join('');
    }
    
    allTasksList.innerHTML = allTasksHTML;
  }

  function exportCSVRange() {
    const fromDate = document.getElementById('exportFromDate').value;
    const toDate = document.getElementById('exportToDate').value;
    
    if (!fromDate || !toDate) { alert('Select date range'); return; }
    if (Object.keys(allData).length === 0) { alert('No data to export'); return; }
    
    let csv = 'Date,Associate,Task,Type,Start,End,Minutes,Blocker,Utilization %\n';
    
    for (const key in allData) {
      const [date, assoc] = key.split('|');
      if (date >= fromDate && date <= toDate) {
        const d = allData[key];
        const workTasks = d.tasks.filter(t => !t.isBreak);
        const totalMin = workTasks.reduce((s, t) => s + t.minutes, 0);
        const util = Math.round(totalMin / 480 * 100);
        
        d.tasks.forEach(t => {
          const type = t.isBreak ? 'BREAK' : 'TASK';
          const blockers = t.blocker || 'None';
          csv += `"${date}","${assoc}","${t.desc}","${type}","${t.start}","${t.end}",${t.minutes},"${blockers}",${util}%\n`;
        });
      }
    }
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `utilization_${fromDate}_to_${toDate}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportCSV() {
    if (Object.keys(allData).length === 0) { alert('No data to export'); return; }
    let csv = 'Date,Associate,Task,Type,Start,End,Minutes,Blocker,Utilization %\n';
    for (const key in allData) {
      const [date, assoc] = key.split('|');
      const d = allData[key];
      const workTasks = d.tasks.filter(t => !t.isBreak);
      const totalMin = workTasks.reduce((s, t) => s + t.minutes, 0);
      const util = Math.round(totalMin / 480 * 100);
      
      d.tasks.forEach(t => {
        const type = t.isBreak ? 'BREAK' : 'TASK';
        const blockers = t.blocker || 'None';
        csv += `"${date}","${assoc}","${t.desc}","${type}","${t.start}","${t.end}",${t.minutes},"${blockers}",${util}%\n`;
      });
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `utilization_all_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportJSON() {
    if (Object.keys(allData).length === 0) { alert('No data to export'); return; }
    const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `utilization_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        allData = { ...allData, ...imported };
        saveData();
        updateDisplay();
        alert('Data restored successfully');
      } catch (err) {
        alert('Import failed - invalid file');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  init();
</script>
